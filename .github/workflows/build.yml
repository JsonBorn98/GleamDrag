name: Extension CI

on:
  push:
    branches: [ main ]
    tags:
      - v2.*.*
  pull_request:
    branches: [ main ]

# Same command path as local (spec: CI 与本地跑同一条命令):
#   bun run typecheck / test:vitest / verify:vitest-exit-code /
#   verify:test-wxt / zip / test:wxt
# The exit-code contract steps run the deliberately failing fixture and
# assert a non-zero exit — a runner that swallows failures turns THESE
# steps red, so the contract itself is verified on every push.

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Vitest pure-logic suite
        run: bun run test:vitest

      - name: Vitest exit-code contract (deliberate failure must exit non-zero)
        run: bun run verify:vitest-exit-code

      - name: Harness contract (watchdog + red stream, judgment path only)
        run: bun run verify:test-wxt

      - name: Build dual MV3 artifacts and zips
        run: bun run zip
        env:
          BUILD_PROFILE: prod

      - name: Upload artifact zips
        uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: .output/*.zip
          if-no-files-found: error

      # In-extension contract suite, Firefox leg only (spec: the Playwright
      # Chromium leg stays local/on-demand — CI does not pass itself off as
      # three-browser acceptance). The runner image ships Firefox at
      # /usr/bin/firefox; detectFirefoxBinary() only probes Windows paths,
      # so the leg needs the explicit override. xvfb-run provides the
      # display for the headed Firefox the suite's end-of-run window close
      # (closeInstance → Firefox quits → web-ext follows) depends on.
      - name: In-extension contract suite (Firefox via web-ext)
        run: xvfb-run --auto-servernum bun run test:wxt --engine firefox
        env:
          GLEAMDRAG_FIREFOX_BIN: /usr/bin/firefox

  release:
    name: Create release and upload packages
    needs:
      - build

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          name: extension-zips
          path: artifacts/

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: artifacts
        shell: bash

      - name: Release on tag
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            artifacts/*
